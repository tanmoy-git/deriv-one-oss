name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  forbidden-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets and org-specific hosts
        run: bash scripts/check-forbidden-patterns.sh

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  python-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v
        env:
          ENABLE_MOCK_AUTH: "true"
          APP_ENV: development
          MODEL_GATEWAY_URL: http://127.0.0.1:4000
      - run: python -c "import main"
        env:
          ENABLE_MOCK_AUTH: "true"
          APP_ENV: development
          MODEL_GATEWAY_URL: http://127.0.0.1:4000

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deriv_one
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/deriv_one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Exactly one head and no duplicate revision ids
        run: |
          alembic heads 2>&1 | tee "$RUNNER_TEMP/heads.txt"
          test "$(grep -c '(head)' "$RUNNER_TEMP/heads.txt")" -eq 1
          ! grep -q "is present more than once" "$RUNNER_TEMP/heads.txt"
      - name: Upgrade an empty database to head
        run: alembic upgrade head
      - name: The latest migration is reversible
        run: alembic downgrade -1 && alembic upgrade head

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose file
        run: docker compose config > /dev/null
