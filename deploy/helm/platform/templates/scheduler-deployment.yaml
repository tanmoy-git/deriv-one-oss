{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-scheduler
  namespace: {{ include "platform.namespace" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
{{- end }}
      containers:
        - name: scheduler
          image: {{ include "platform.backendImage" . }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["python", "-m", "scheduler_worker"]
          envFrom:
            - configMapRef:
                name: {{ include "platform.configMapName" . }}
            - secretRef:
                name: {{ include "platform.secretName" . }}
          env:
            - name: ENABLE_CRON_SCHEDULER
              value: "true"
{{- if .Values.scheduler.metricsPort }}
            - name: SCHEDULER_METRICS_PORT
              value: {{ .Values.scheduler.metricsPort | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.scheduler.metricsPort | int }}
{{- end }}
          resources:
            {{- toYaml .Values.resources.scheduler | nindent 12 }}
{{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- end }}
